<body class="bg-background text-on-surface antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed h-screen w-full overflow-hidden">
<!-- Main Split-Screen Container -->
<div class="flex h-full w-full">
<!-- Left Pane: Brand & Marketing (Hidden on smaller screens) -->
<div class="hidden lg:flex lg:w-1/2 xl:w-5/12 bg-surface-container relative flex-col justify-between overflow-hidden border-r border-outline-variant/30">
<!-- Abstract Education Background Image -->
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-40 mix-blend-multiply" data-alt="A highly detailed, high-key architectural photograph of a modern, minimalist university library or campus atrium. The space is flooded with bright, soft natural light creating a pristine, airy aesthetic suitable for a corporate SaaS product. Clean geometric lines, subtle depth, predominantly white and light grey tones with very subtle cool blue ambient shadows. The mood is calm, authoritative, and focuses on institutional reliability without clutter." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBcy1D9OOTSsWKivtidfM4BPwwjq9LS6dDxGA6LzVB39iIdNd0BAdbvY95NoCj7fXFKoTZlj1GQuanSKS2WIPvMbbJkXc07ep87mR9f9UwlJM01jAHoiwl0s7P9pSDTzccfkiqeG3vqyf2SF5w2LBdEww9asIOpotlZ8EEozIswzYBPzcR6X5jKPh6CAJRl5R6MnA4XkWIX-7xBsxnbhlLb3qO9Li46n6uumUMAFVGAp9qPNYoD2aFNRg')">
</div>
<!-- Soft gradient overlay to ensure text readability -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-low/80 via-transparent to-surface-container-low/90"></div>
<!-- Header / Logo Area -->
<div class="relative z-10 p-margin pt-12">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[32px]">school</span>
<span class="font-headline-sm text-headline-sm text-primary tracking-tight">EduFlow</span>
</div>
</div>
<!-- Content Area -->
<div class="relative z-10 p-margin pb-16 max-w-[480px]">
<h1 class="font-display-sm text-display-sm text-on-surface mb-6">
                    Everything your school needs, in one place.
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Manage students, attendance, fees, exams and communication from one modern school management platform.
                </p>
<!-- Decorative Elements -->
<div class="flex gap-4 mt-12 opacity-80">
<div class="h-1 w-12 rounded-full bg-secondary"></div>
<div class="h-1 w-2 rounded-full bg-outline-variant"></div>
<div class="h-1 w-2 rounded-full bg-outline-variant"></div>
</div>
</div>
</div>
<!-- Right Pane: Login Form -->
<div class="w-full lg:w-1/2 xl:w-7/12 bg-surface-container-lowest flex items-center justify-center p-lg sm:p-margin relative">
<!-- Mobile Logo (Visible only on small screens) -->
<div class="absolute top-8 left-8 flex lg:hidden items-center gap-2">
<span class="material-symbols-outlined text-secondary text-[28px]">school</span>
<span class="font-title-lg text-title-lg text-primary">EduFlow</span>
</div>
<!-- Form Container -->
<div class="w-full max-w-[400px]">
<div class="mb-10 text-center lg:text-left">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email / Phone Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="identifier">Email or Phone number</label>
<div class="relative">
<input class="block w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-all" id="identifier" name="identifier" placeholder="admin@school.edu" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<input class="block w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 pr-10 font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Password Visibility Toggle (Decorative) -->
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-secondary focus:ring-secondary cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="font-label-md text-label-md">
<a class="text-secondary hover:text-on-secondary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="flex w-full justify-center items-center rounded-lg bg-secondary px-4 py-3 font-label-md text-label-md text-on-secondary shadow-sm hover:bg-secondary/90 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-all" type="submit">
                            Log In
                        </button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-md text-label-md text-secondary hover:text-on-secondary-fixed-variant transition-colors" href="#">Request a Demo</a>
</p>
</div>
</div>
</div>
</div>
