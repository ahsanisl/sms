<p class="font-body-md text-body-md text-on-surface-variant max-w-[300px]">
                Enter your email address and we'll send you a password reset link.
            </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-5 w-full mt-2">
<!-- Email Input -->
<div class="flex flex-col gap-1.5 w-full relative">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder-outline focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors" id="email" name="email" placeholder="admin@school.edu" required="" type="email"/>
</div>
</div>
<!-- Submit Action -->
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-2.5 px-4 rounded flex items-center justify-center gap-2 hover:bg-on-secondary-fixed-variant transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2" type="submit">

<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
